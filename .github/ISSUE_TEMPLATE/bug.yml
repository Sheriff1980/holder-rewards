name: Bug report
description: Report something that is broken or behaving unexpectedly.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include Discord bot tokens, private verification links, wallet signatures, or provider keys.
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Cloudflare Worker
        - Docker
        - Local development
        - Other self-hosted setup
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the command or page you used and the result you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove secrets, private links, signatures, and full wallet-to-Discord mappings.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed all secrets and private verification links from this report.
          required: true
