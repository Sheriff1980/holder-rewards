services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dripclone
      POSTGRES_PASSWORD: dripclone
      POSTGRES_DB: dripclone
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dripclone -d dripclone"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://dripclone:dripclone@postgres:5432/dripclone
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    command: ["pnpm", "--filter", "@holder-rewards/db", "migrate"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://dripclone:dripclone@postgres:5432/dripclone
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://dripclone:dripclone@postgres:5432/dripclone
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
